name: ساخت APK ایتو

on:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: "APK ساخته‌شده را داخل پوشه‌ی dist کامیت کن"
        type: boolean
        default: true
      apk_abi:
        description: "کدام معماری‌ها داخل مخزن کامیت شوند"
        type: choice
        default: "arm64-v8a"
        options:
          - "arm64-v8a"
          - "all"
      run_smoke:
        description: "تست اجرا روی شبیه‌ساز هم انجام شود"
        type: boolean
        default: true
  push:
    branches:
      - "arena/**"
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: ito-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بیلد و تست
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی اندروید SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: بازتولید کاتالوگ قابلیت‌ها
        run: |
          mkdir -p ci-logs
          python3 tools/gen_features.py 2>&1 | tee -a ci-logs/build.log
          python3 - <<'PY'
          import json
          d = json.load(open("app/src/main/assets/features.json", encoding="utf-8"))
          print("total features:", d["total"], d["stats"])
          assert d["total"] >= 2000, "کاتالوگ کمتر از ۲۰۰۰ آیتم دارد"
          PY

      - name: بررسی‌های سریع پیش از کامپایل
        run: |
          set -o pipefail
          python3 tools/check_catalog.py 2>&1 | tee -a ci-logs/build.log
          python3 tools/kt_sanity.py 2>&1 | tee -a ci-logs/build.log

      - name: دریافت TDLib از پیش ساخته‌شده
        run: |
          set -o pipefail
          gradle :app:fetchTdlib --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -20
          echo "--- محتوای TDLib ---" | tee -a ci-logs/build.log
          find app/build/tdlib/jniLibs -name '*.so' -printf '%p %s\n' 2>&1 | tee -a ci-logs/build.log || true
          ls app/build/tdlib/java/org/drinkless/tdlib 2>&1 | tee -a ci-logs/build.log || true
          if [ -z "$(find app/build/tdlib/jniLibs -name 'libtdjni.so' 2>/dev/null)" ]; then
            echo "TDLIB_OK=false" >> $GITHUB_ENV
            echo "::warning::TDLib دانلود نشد؛ APK در حالت آفلاین ساخته می‌شود"
          else
            echo "TDLIB_OK=true" >> $GITHUB_ENV
          fi

      - name: تست‌های واحد
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -40

      - name: لینت
        run: |
          set -o pipefail
          gradle :app:lintDebug --no-daemon 2>&1 | tee -a ci-logs/build.log | tail -20 || true

      - name: ساخت کلید امضا
        run: |
          keytool -genkeypair -v \
            -keystore ito-release.jks \
            -alias ito \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass itoTelegram -keypass itoTelegram \
            -dname "CN=Ito Telegram, OU=Ito, O=Ito, L=Tehran, S=Tehran, C=IR" > /dev/null

      - name: بیلد APK دیباگ و ریلیز
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -40
          echo "--- خروجی‌ها ---"
          find app/build/outputs/apk -name '*.apk' -printf '%p %s\n' | tee -a ci-logs/build.log

      - name: گزارش
        if: always()
        run: |
          {
            echo "### نتیجه‌ی بیلد ایتو"
            echo ""
            echo "- TDLib داخل APK: \`${TDLIB_OK}\`"
            echo ""
            echo "| فایل | حجم |"
            echo "| --- | --- |"
            find app/build/outputs/apk -name '*.apk' -printf '| %f | %s بایت |\n' 2>/dev/null || true
          } >> $GITHUB_STEP_SUMMARY

      - name: آپلود APK ها
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ito-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30

      # ---- لاگ را داخل خود مخزن می‌گذاریم، چون دانلود لاگ اکشن از همه‌جا ممکن نیست
      - name: ثبت لاگ بیلد در مخزن
        if: always()
        run: |
          mkdir -p ci-logs
          tail -c 400000 ci-logs/build.log > ci-logs/last-build.log 2>/dev/null || true
          {
            echo "=== وضعیت: ${{ job.status }} — اجرا #${GITHUB_RUN_NUMBER} ==="
            echo "=== خطاهای برجسته ==="
            grep -n -E "^e: |error: |FAILED|Execution failed|Caused by:|Unresolved reference|AssertionError|Compilation error" ci-logs/build.log | tail -120 || true
          } > ci-logs/errors.txt
          cp -f app/build/reports/tests/testDebugUnitTest/index.html ci-logs/unit-tests.html 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec sh -c 'grep -l "<failure\|<error" "$1" >> ci-logs/failed-tests.txt' _ {} \; 2>/dev/null || true
          for f in $(cat ci-logs/failed-tests.txt 2>/dev/null | head -5); do
            echo "=== $f ===" >> ci-logs/errors.txt
            cat "$f" >> ci-logs/errors.txt
          done
          rm -f ci-logs/build.log
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f ci-logs
          git commit -m "ci: لاگ اجرای ${GITHUB_RUN_NUMBER} [skip ci]" || echo "بدون تغییر"
          git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || echo "پوش لاگ ناموفق"

      - name: کامیت APK داخل مخزن
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.commit_apk }}
        run: |
          set -e
          mkdir -p dist
          rm -f dist/*.apk
          ARM64=$(find app/build/outputs/apk/release -name '*arm64*.apk' | head -1)
          ANY=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "${ARM64:-$ANY}" dist/ito-telegram-arm64-v8a-release.apk
          if [ "${{ inputs.apk_abi }}" = "all" ]; then
            ARM32=$(find app/build/outputs/apk/release -name '*armeabi*.apk' | head -1)
            [ -n "$ARM32" ] && cp "$ARM32" dist/ito-telegram-armeabi-v7a-release.apk || true
          fi
          {
            echo "# APK ایتو"
            echo
            echo "ساخته‌شده در اجرای #${GITHUB_RUN_NUMBER} از کامیت ${GITHUB_SHA}"
            echo
            for f in dist/*.apk; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1) — sha256 \`$(sha256sum "$f" | cut -c1-16)…\`"
            done
            echo
            echo "امضا: کلید یک‌بارمصرفِ همین اجرا. برای به‌روزرسانیِ روی‌هم، کلید خودتان را در Secrets بگذارید."
          } > dist/README.md
          ls -l dist
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f dist
          git commit -m "build: APK ایتو از اجرای ${GITHUB_RUN_NUMBER} [skip ci]" || echo "بدون تغییر"
          git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

  smoke:
    name: تست اجرا روی شبیه‌ساز
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # به‌جای بیلد دوباره، همان APK جاب قبلی را می‌گیریم: هم سریع‌تر، هم دقیقاً همان چیزی
      # که به دست کاربر می‌رسد تست می‌شود.
      - name: دریافت APK از جاب بیلد
        uses: actions/download-artifact@v4
        with:
          name: ito-apks
          path: apks

      - name: فهرست APK ها
        run: |
          mkdir -p ci-logs
          find apks -name '*.apk' -printf '%p %s\n' | tee -a ci-logs/smoke.log

      - name: فعال‌سازی KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: اجرا روی شبیه‌ساز و شکار کرش
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            set -x
            exec > >(tee -a "$GITHUB_WORKSPACE/ci-logs/smoke.log") 2>&1
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            APK=$(find apks -name '*x86_64-debug.apk' | head -1)
            [ -n "$APK" ] || APK=$(find apks -name '*universal-debug.apk' | head -1)
            echo "نصب $APK"
            adb install -r -t "$APK" || { adb logcat -d > "$GITHUB_WORKSPACE/ci-logs/logcat.txt"; echo "نصب ناموفق"; exit 1; }
            adb logcat -c
            adb shell am start -W -n ito.telegram.debug/ito.telegram.MainActivity
            sleep 20
            adb shell dumpsys activity activities | grep -i -m 5 'ito.telegram' || true
            adb shell monkey -p ito.telegram.debug --throttle 200 --pct-syskeys 0 -v 600 || true
            sleep 5
            adb logcat -d > "$GITHUB_WORKSPACE/ci-logs/logcat.txt"
            if grep -E "FATAL EXCEPTION|ANR in ito.telegram" "$GITHUB_WORKSPACE/ci-logs/logcat.txt"; then
              grep -B 5 -A 60 "FATAL EXCEPTION" "$GITHUB_WORKSPACE/ci-logs/logcat.txt" || true
              exit 1
            fi
            echo "بدون کرش"

      - name: ثبت نتیجه‌ی شبیه‌ساز در مخزن
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "=== شبیه‌ساز: ${{ job.status }} — اجرا #${GITHUB_RUN_NUMBER} ==="
            echo
            echo "--- خروجی اسکریپت (۴۰۰ خط آخر) ---"
            tail -400 ci-logs/smoke.log 2>/dev/null || echo "اسکریپت اصلاً اجرا نشد (شبیه‌ساز بالا نیامد)"
            echo
            echo "--- ردپای کرش در لاگ‌کت ---"
            grep -E "FATAL EXCEPTION|AndroidRuntime|ANR in|ito\.telegram" ci-logs/logcat.txt 2>/dev/null | tail -200 \
              || echo "لاگ‌کتی ثبت نشد"
          } > ci-logs/emulator.txt
          rm -f ci-logs/smoke.log
          head -c 300000 ci-logs/logcat.txt > ci-logs/logcat-tail.txt 2>/dev/null || true
          rm -f ci-logs/logcat.txt
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f ci-logs
          git commit -m "ci: نتیجه‌ی شبیه‌ساز ${GITHUB_RUN_NUMBER} [skip ci]" || echo "بدون تغییر"
          for i in 1 2 3; do
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 10
          done
