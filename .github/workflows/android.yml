name: ساخت APK ایتو

on:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: "APK ساخته‌شده را داخل پوشه‌ی dist کامیت کن"
        type: boolean
        default: true
  push:
    branches:
      - "arena/**"
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: ito-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بیلد و تست
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی اندروید SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: بازتولید کاتالوگ قابلیت‌ها
        run: |
          python3 tools/gen_features.py
          if ! git diff --quiet -- app/src/main/assets/features.json; then
            echo "::warning::features.json با خروجی مولد فرق داشت و به‌روز شد"
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("app/src/main/assets/features.json", encoding="utf-8"))
          print("total features:", d["total"], d["stats"])
          assert d["total"] >= 2000, "کاتالوگ کمتر از ۲۰۰۰ آیتم دارد"
          PY

      - name: دریافت TDLib از پیش ساخته‌شده
        run: |
          set -o pipefail
          gradle :app:fetchTdlib --no-daemon --stacktrace | tail -30
          echo "--- محتوای TDLib ---"
          find app/build/tdlib/jniLibs -name '*.so' -printf '%p %s\n' 2>/dev/null || true
          ls app/build/tdlib/java/org/drinkless/tdlib 2>/dev/null | head || true
          if [ -z "$(find app/build/tdlib/jniLibs -name 'libtdjni.so' 2>/dev/null)" ]; then
            echo "TDLIB_OK=false" >> $GITHUB_ENV
            echo "::warning::TDLib دانلود نشد؛ APK در حالت آفلاین ساخته می‌شود"
          else
            echo "TDLIB_OK=true" >> $GITHUB_ENV
          fi

      - name: تست‌های واحد
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: لینت
        run: gradle :app:lintDebug --no-daemon || true

      - name: ساخت کلید امضا
        run: |
          keytool -genkeypair -v \
            -keystore ito-release.jks \
            -alias ito \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass itoTelegram -keypass itoTelegram \
            -dname "CN=Ito Telegram, OU=Ito, O=Ito, L=Tehran, S=Tehran, C=IR"

      - name: بیلد APK دیباگ و ریلیز
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          echo "--- خروجی‌ها ---"
          find app/build/outputs/apk -name '*.apk' -printf '%p %s\n'

      - name: گزارش
        run: |
          {
            echo "### نتیجه‌ی بیلد ایتو"
            echo ""
            echo "- TDLib داخل APK: \`${TDLIB_OK}\`"
            echo ""
            echo "| فایل | حجم |"
            echo "| --- | --- |"
            find app/build/outputs/apk -name '*.apk' -printf '| %f | %s بایت |\n'
          } >> $GITHUB_STEP_SUMMARY

      - name: آپلود APK ها
        uses: actions/upload-artifact@v4
        with:
          name: ito-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30

      - name: آپلود گزارش تست در صورت شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ito-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: کامیت APK داخل مخزن
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_apk }}
        run: |
          set -e
          mkdir -p dist
          rm -f dist/*.apk
          UNIVERSAL=$(find app/build/outputs/apk/release -name '*universal*.apk' | head -1)
          ANY_RELEASE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SRC=${UNIVERSAL:-$ANY_RELEASE}
          cp "$SRC" dist/ito-telegram-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/ito-telegram-debug.apk 2>/dev/null || true
          ls -l dist
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f dist app/src/main/assets/features.json
          git commit -m "build: APK ایتو از اجرای ${GITHUB_RUN_NUMBER}" || echo "چیزی برای کامیت نبود"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

  smoke:
    name: تست اجرا روی شبیه‌ساز
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: فعال‌سازی KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: اجرا روی شبیه‌ساز و شکار کرش
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            gradle :app:assembleDebug --no-daemon
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n ito.telegram.debug/ito.telegram.MainActivity
            sleep 12
            adb shell monkey -p ito.telegram.debug --throttle 120 --pct-syskeys 0 -v 600 || true
            sleep 5
            adb logcat -d > logcat.txt
            echo "=== دنبال کرش می‌گردیم ==="
            if grep -E "FATAL EXCEPTION|ANR in ito.telegram" logcat.txt; then
              echo "::error::کرش پیدا شد"
              grep -A 40 "FATAL EXCEPTION" logcat.txt || true
              exit 1
            fi
            echo "بدون کرش ✅"

      - name: آپلود لاگ‌کت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ito-logcat
          path: logcat.txt
          if-no-files-found: ignore
