name: ساخت APK ایتو

on:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: "APK ساخته‌شده را داخل پوشه‌ی dist کامیت کن"
        type: boolean
        default: true
      apk_abi:
        description: "کدام معماری‌ها داخل مخزن کامیت شوند"
        type: choice
        default: "arm64-v8a"
        options:
          - "arm64-v8a"
          - "all"
      run_smoke:
        description: "تست اجرا روی شبیه‌ساز هم انجام شود"
        type: boolean
        default: true
  push:
    branches:
      - "arena/**"
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: ito-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بیلد و تست
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی اندروید SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: بازتولید کاتالوگ قابلیت‌ها
        run: |
          mkdir -p ci-logs
          python3 tools/gen_features.py 2>&1 | tee -a ci-logs/build.log
          python3 - <<'PY'
          import json
          d = json.load(open("app/src/main/assets/features.json", encoding="utf-8"))
          print("total features:", d["total"], d["stats"])
          assert d["total"] >= 2000, "کاتالوگ کمتر از ۲۰۰۰ آیتم دارد"
          PY

      - name: بررسی‌های سریع پیش از کامپایل
        run: |
          set -o pipefail
          python3 tools/check_catalog.py 2>&1 | tee -a ci-logs/build.log
          python3 tools/kt_sanity.py 2>&1 | tee -a ci-logs/build.log

      - name: دریافت TDLib از پیش ساخته‌شده
        run: |
          set -o pipefail
          gradle :app:fetchTdlib --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -20
          echo "--- محتوای TDLib ---" | tee -a ci-logs/build.log
          find app/build/tdlib/jniLibs -name '*.so' -printf '%p %s\n' 2>&1 | tee -a ci-logs/build.log || true
          ls app/build/tdlib/java/org/drinkless/tdlib 2>&1 | tee -a ci-logs/build.log || true
          if [ -z "$(find app/build/tdlib/jniLibs -name 'libtdjni.so' 2>/dev/null)" ]; then
            echo "TDLIB_OK=false" >> $GITHUB_ENV
            echo "::warning::TDLib دانلود نشد؛ APK در حالت آفلاین ساخته می‌شود"
          else
            echo "TDLIB_OK=true" >> $GITHUB_ENV
          fi

      - name: تست‌های واحد
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -40

      - name: لینت
        run: |
          set -o pipefail
          gradle :app:lintDebug --no-daemon 2>&1 | tee -a ci-logs/build.log | tail -20 || true

      - name: ساخت کلید امضا
        run: |
          keytool -genkeypair -v \
            -keystore ito-release.jks \
            -alias ito \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass itoTelegram -keypass itoTelegram \
            -dname "CN=Ito Telegram, OU=Ito, O=Ito, L=Tehran, S=Tehran, C=IR" > /dev/null

      - name: بیلد APK دیباگ و ریلیز
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -40
          echo "--- خروجی‌ها ---"
          find app/build/outputs/apk -name '*.apk' -printf '%p %s\n' | tee -a ci-logs/build.log

      - name: گزارش
        if: always()
        run: |
          {
            echo "### نتیجه‌ی بیلد ایتو"
            echo ""
            echo "- TDLib داخل APK: \`${TDLIB_OK}\`"
            echo ""
            echo "| فایل | حجم |"
            echo "| --- | --- |"
            find app/build/outputs/apk -name '*.apk' -printf '| %f | %s بایت |\n' 2>/dev/null || true
          } >> $GITHUB_STEP_SUMMARY

      - name: آپلود APK ها
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ito-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30

      # APKِ «همه‌ی گوشی‌ها»: یک فایل با هر دو معماری ARM، بدون x86_64 تا زیر
      # سقف صد مگابایتیِ گیت‌هاب بماند. عملاً هر گوشی اندرویدیِ واقعی را پوشش می‌دهد.
      - name: ساخت APK همه‌گوشی
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.commit_apk) || contains(github.event.head_commit.message, '[apk]')) }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PitoAbis=arm64-v8a,armeabi-v7a \
            --no-daemon --stacktrace 2>&1 | tee -a ci-logs/build.log | tail -5
          find app/build/outputs/apk/release -name '*.apk' -printf '%p %s\n' | tee -a ci-logs/build.log

      # ---- لاگ را داخل خود مخزن می‌گذاریم، چون دانلود لاگ اکشن از همه‌جا ممکن نیست
      - name: ثبت لاگ بیلد در مخزن
        if: always()
        run: |
          mkdir -p ci-logs
          tail -c 400000 ci-logs/build.log > ci-logs/last-build.log 2>/dev/null || true
          {
            echo "=== وضعیت: ${{ job.status }} — اجرا #${GITHUB_RUN_NUMBER} ==="
            echo "=== خطاهای برجسته ==="
            grep -n -E "^e: |error: |FAILED|Execution failed|Caused by:|Unresolved reference|AssertionError|Compilation error" ci-logs/build.log | tail -120 || true
          } > ci-logs/errors.txt
          cp -f app/build/reports/tests/testDebugUnitTest/index.html ci-logs/unit-tests.html 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec sh -c 'grep -l "<failure\|<error" "$1" >> ci-logs/failed-tests.txt' _ {} \; 2>/dev/null || true
          for f in $(cat ci-logs/failed-tests.txt 2>/dev/null | head -5); do
            echo "=== $f ===" >> ci-logs/errors.txt
            cat "$f" >> ci-logs/errors.txt
          done
          rm -f ci-logs/build.log
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f ci-logs
          git commit -m "ci: لاگ اجرای ${GITHUB_RUN_NUMBER} [skip ci]" || echo "بدون تغییر"
          for i in 1 2 3; do
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 10
          done

      - name: کامیت APK داخل مخزن
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.commit_apk) || contains(github.event.head_commit.message, '[apk]')) }}
        run: |
          set -e
          mkdir -p dist
          rm -f dist/*.apk
          UNI=$(find app/build/outputs/apk/release -name '*universal*.apk' | head -1)
          if [ -z "$UNI" ]; then
            echo "::error::APK یونیورسال ساخته نشد"
            exit 1
          fi
          SIZE=$(stat -c%s "$UNI")
          echo "اندازه‌ی یونیورسال: $SIZE بایت"
          LIMIT=99000000
          if [ "$SIZE" -gt "$LIMIT" ]; then
            # نقشه‌ی دوم: به‌جای یک فایلِ گنده، دو فایل جدا برای ۶۴ و ۳۲ بیتی
            echo "::warning::یونیورسال بزرگ شد ($SIZE)؛ دو فایل جدا کامیت می‌شود"
            A64=$(find app/build/outputs/apk/release -name '*arm64*.apk' | head -1)
            A32=$(find app/build/outputs/apk/release -name '*armeabi*.apk' | head -1)
            if [ -n "$A64" ]; then cp "$A64" dist/ito-telegram-64bit.apk; fi
            if [ -n "$A32" ]; then cp "$A32" dist/ito-telegram-32bit.apk; fi
            SPLIT_MODE=1
          else
            SPLIT_MODE=0
          fi
          if [ "$SPLIT_MODE" = "0" ]; then cp "$UNI" dist/ito-telegram-all-phones.apk; fi
          {
            echo "# APK ایتو"
            echo
            echo "ساخته‌شده در اجرای #${GITHUB_RUN_NUMBER} از کامیت ${GITHUB_SHA}"
            echo
            echo "| فایل | اندازه | معماری | اندروید |"
            echo "|---|---|---|---|"
            for f in dist/*.apk; do
              case "$(basename "$f")" in
                *all-phones*) ABI="arm64-v8a + armeabi-v7a (هر گوشی)" ;;
                *64bit*) ABI="arm64-v8a (گوشی‌های ۶۴بیتی)" ;;
                *32bit*) ABI="armeabi-v7a (گوشی‌های قدیمی ۳۲بیتی)" ;;
                *) ABI="?" ;;
              esac
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | $ABI | ۷ به بالا |"
            done
            echo
            for f in dist/*.apk; do
              echo "- sha256 \`$(basename "$f")\`: \`$(sha256sum "$f" | cut -d" " -f1)\`"
            done
            echo
            echo "کافی است نصبش کنی، شماره بزنی و کد را کپی کنی — بقیه‌اش خودکار است."
            echo
            echo "امضا: کلید یک‌بارمصرفِ همین اجرا. برای به‌روزرسانیِ روی‌هم، کلید خودتان را در Secrets بگذارید."
          } > dist/README.md
          ls -l dist
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f dist
          git commit -m "build: APK ایتو از اجرای ${GITHUB_RUN_NUMBER} [skip ci]" || echo "بدون تغییر"
          for i in 1 2 3; do
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 10
          done

      # انتشار ریلیز با فایلِ ضمیمه. آپلود حتماً باید از خودِ رانر انجام شود.
      - name: انتشار ریلیز
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.commit_apk) || contains(github.event.head_commit.message, '[apk]')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          SHA=$(git rev-parse HEAD)
          {
            echo "کلاینت غیررسمی تلگرام، ساخته‌شده روی TDLib ۱٫۸٫۶۷ با **۲۰۰۶ قابلیت**."
            echo
            echo "## نصب"
            echo
            echo "فایل زیر را بگیر و نصب کن. بعد فقط شماره‌ات را با کد کشور بزن؛"
            echo "کد که آمد کپی‌اش کن و برگرد — برنامه خودش برش می‌دارد و وارد می‌کند."
            echo "نه کلید API می‌خواهد، نه ثبت‌نام جایی."
            echo
            echo "| فایل | اندازه | معماری | اندروید |"
            echo "|---|---|---|---|"
            for f in dist/*.apk; do
              case "$(basename "$f")" in
                *all-phones*) ABI="arm64-v8a + armeabi-v7a — هر گوشی" ;;
                *64bit*) ABI="arm64-v8a" ;;
                *32bit*) ABI="armeabi-v7a" ;;
                *) ABI="?" ;;
              esac
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | $ABI | ۷ به بالا |"
            done
            echo
            echo "## درستی فایل"
            echo
            for f in dist/*.apk; do
              echo "- \`$(basename "$f")\`"
              echo "  \`$(sha256sum "$f" | cut -d" " -f1)\`"
            done
            echo
            echo "## این نسخه چه چیزی را تست کرده؟"
            echo
            echo "- تست‌های واحد و لینت: سبز"
            echo "- نصب و اجرا روی شبیه‌ساز اندروید ۱۱: سبز"
            echo "- ۶۰۰ رویداد تصادفی monkey بدون \`FATAL EXCEPTION\` و بدون ANR"
            echo
            echo "## دو هشدار صادقانه"
            echo
            echo "۱. امضا با کلیدِ یک‌بارمصرفِ همین اجراست، پس نسخه‌ی بعدی روی این یکی"
            echo "   نصب نمی‌شود؛ اول قبلی را پاک کن."
            echo "۲. این یک کلاینت غیررسمی است و با تلگرام هیچ نسبتی ندارد."
            echo
            echo "کامیت: \`${SHA}\` — اجرای #${GITHUB_RUN_NUMBER}"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes-file release-notes.md --target "$SHA"
          else
            gh release create "$TAG" dist/*.apk \
              --title "ایتو $TAG — کلاینت تلگرام با ۲۰۰۶ قابلیت" \
              --notes-file release-notes.md \
              --target "$SHA" \
              --latest
          fi
          rm -f release-notes.md
          echo "ریلیز منتشر شد: $TAG"
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[] | "\(.name) \(.size)")'

  smoke:
    name: تست اجرا روی شبیه‌ساز
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      # به‌جای بیلد دوباره، همان APK جاب قبلی را می‌گیریم
      - name: دریافت APK از جاب بیلد
        uses: actions/download-artifact@v4
        with:
          name: ito-apks
          path: apks

      - name: فعال‌سازی KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM نیست!"

      # شبیه‌ساز را دستی بالا می‌آوریم تا تمام خروجی داخل فایل لاگ بیفتد
      # (لاگِ خودِ اکشن از این سندباکس قابل دانلود نیست).
      - name: نصب و بوت شبیه‌ساز
        id: boot
        run: |
          mkdir -p ci-logs
          exec > >(tee -a ci-logs/smoke.log) 2>&1
          set -x
          find apks -name '*.apk' -printf '%p %s\n'
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" 2>&1 | tr '\r' '\n' | tail -3
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n ito -k "system-images;android-30;google_apis;x86_64" -d pixel_5 --force
          CFG=$(find "$HOME" -name config.ini -path '*ito.avd*' 2>/dev/null | head -1)
          echo "پرونده‌ی تنظیمات AVD: ${CFG:-پیدا نشد}"
          if [ -n "$CFG" ]; then
            printf 'hw.ramSize=3072\nvm.heapSize=512\nhw.camera.front=emulated\nhw.camera.back=emulated\ndisk.dataPartition.size=6G\n' >> "$CFG"
          fi
          nohup emulator -avd ito -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -accel on -camera-front emulated -camera-back emulated \
            > ci-logs/emulator-boot.log 2>&1 &
          adb wait-for-device
          timeout 600 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 3; done' || {
            echo "شبیه‌ساز بوت نشد"; tail -60 ci-logs/emulator-boot.log; exit 1; }
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0.0
          adb shell settings put global transition_animation_scale 0.0
          adb shell settings put global animator_duration_scale 0.0
          adb shell getprop ro.build.version.sdk
          echo "شبیه‌ساز آماده است"

      - name: نصب و شکار کرش
        if: steps.boot.outcome == 'success'
        run: |
          exec > >(tee -a ci-logs/smoke.log) 2>&1
          set -x
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          APK=$(find apks -name '*x86_64-debug.apk' | head -1)
          [ -n "$APK" ] || APK=$(find apks -name '*universal-debug.apk' | head -1)
          adb install -r -t "$APK"
          adb logcat -c
          adb shell am start -W -n ito.telegram.debug/ito.telegram.MainActivity
          sleep 20
          adb shell dumpsys activity activities | grep -m 5 -i 'ito.telegram' || true
          adb shell monkey -p ito.telegram.debug --throttle 200 --pct-syskeys 0 -v 600 || true
          sleep 5
          adb logcat -d > ci-logs/logcat.txt
          if grep -E "FATAL EXCEPTION|ANR in ito.telegram" ci-logs/logcat.txt; then
            grep -B 5 -A 60 "FATAL EXCEPTION" ci-logs/logcat.txt || true
            exit 1
          fi
          echo "بدون کرش"

      - name: ثبت نتیجه‌ی شبیه‌ساز در مخزن
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "=== شبیه‌ساز: ${{ job.status }} — اجرا #${GITHUB_RUN_NUMBER} ==="
            echo
            echo "--- خروجی اسکریپت (۵۰۰ خط آخر) ---"
            tail -500 ci-logs/smoke.log 2>/dev/null || echo "هیچ خروجی‌ای نبود"
            echo
            echo "--- بوت شبیه‌ساز (۶۰ خط آخر) ---"
            tail -60 ci-logs/emulator-boot.log 2>/dev/null || echo "بوت‌لاگی نبود"
            echo
            echo "--- ردپای کرش در لاگ‌کت ---"
            grep -E "FATAL EXCEPTION|AndroidRuntime|ANR in|ito\.telegram" ci-logs/logcat.txt 2>/dev/null | tail -200 \
              || echo "لاگ‌کتی ثبت نشد"
          } > ci-logs/emulator.txt
          rm -f ci-logs/smoke.log ci-logs/emulator-boot.log
          tail -c 300000 ci-logs/logcat.txt > ci-logs/logcat-tail.txt 2>/dev/null || true
          rm -f ci-logs/logcat.txt
          git config user.name "ito-build-bot"
          git config user.email "actions@github.com"
          git add -f ci-logs
          git commit -m "ci: نتیجه‌ی شبیه‌ساز ${GITHUB_RUN_NUMBER} [skip ci]" || echo "بدون تغییر"
          for i in 1 2 3; do
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 10
          done
